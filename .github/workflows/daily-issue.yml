name: daily-issue

on:
  schedule:
    # 매일 05:30 KST = 전날 20:30 UTC (주말 포함)
    - cron: "30 20 * * *"
  workflow_dispatch:

# 수동 실행과 cron이 겹치면 push 충돌 → 직렬화
concurrency:
  group: daily-issue
  cancel-in-progress: false

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect public feeds
        run: python3 scripts/pipeline/run.py --collect-only
      - name: Draft Korean issue when an API key is present
        timeout-minutes: 20
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          GLM_REASONING: low
          # P11: LLM_TIMEOUT 고정(600) 제거 — draft.py의 attempt별 타임아웃
          # (P7: 1차 300s → 2차 240s → 3차 180s)이 env 고정에 무력화되던 문제 수정.
          # env가 없으면 attempt별 기본값이 적용된다.
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$GLM_API_KEY$ZHIPU_API_KEY$XAI_API_KEY$GROK_API_KEY$OPENAI_API_KEY" ]; then
            python3 scripts/pipeline/run.py --llm --skip-collect
          else
            # fail-closed: 키 없음도 조용한 스킵이 아니라 실패로 처리 (알림 발동)
            echo "::error::no LLM key — failing closed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-${{ github.run_id }}
          path: |
            content/pipeline/
            content/issues/
          if-no-files-found: warn
      - name: Publish issue to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          git config user.name "fiv-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add "content/issues/${DATE}.json" 2>/dev/null || true
          git add "public/img/${DATE}/" 2>/dev/null || true
          STAGED=$(git diff --cached --name-only)
          if [ -z "$STAGED" ]; then
            echo "no new issue file — published copy kept"
            exit 0
          fi
          # 푸시 범위 제한: 오늘 호 파일(이슈 JSON + 이미지) 외에는 커밋하지 않음
          case "$STAGED" in
            "content/issues/"*|"public/img/"*) ;;
            *)
              echo "::error::unexpected staged paths: $STAGED"
              exit 1
              ;;
          esac
          git commit -m "publish ${DATE} issue"
          git push origin HEAD:main
          echo "pushed ${DATE} to main — Vercel will rebuild"
      - name: Close resolved alerts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          for NUM in $(gh issue list --search "🚨 파이프라인 실패 in:title" --state open --json number --jq '.[].number'); do
            gh issue close "$NUM" --comment "복구됨: ${DATE} 호 정상 발행"
          done
      - name: Alert on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          TITLE="🚨 파이프라인 실패 ${DATE}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="run: ${RUN_URL}\n아티팩트: pipeline-${{ github.run_id }}"
          # 같은 날 중복 이슈 방지: 열린 이슈가 있으면 댓글로 누적
          NUM=$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue comment "$NUM" --body "재발생: $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "pipeline" || echo "::warning::issue create failed"
          fi
          # Slack 실시간 알림 (시크릿이 있을 때만)
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl --fail -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"🚨 fiv-ai-news 파이프라인 실패 (${DATE})\n${RUN_URL}\"}" \
              "$SLACK_WEBHOOK_URL" || echo "::warning::slack webhook failed"
          fi
