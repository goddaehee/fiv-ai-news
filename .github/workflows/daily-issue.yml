name: daily-issue

on:
  schedule:
    # 평일 05:30 KST = 전날 20:30 UTC (일–목)
    - cron: "30 20 * * 0-4"
  workflow_dispatch:

jobs:
  collect-and-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Collect public feeds
        run: python3 scripts/pipeline/run.py --collect-only
      - name: Draft Korean issue when an API key is present
        timeout-minutes: 20
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
          GLM_MODEL: ${{ secrets.GLM_MODEL }}
          GLM_REASONING: low
          LLM_TIMEOUT: "600"
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$GLM_API_KEY$ZHIPU_API_KEY$XAI_API_KEY$GROK_API_KEY$OPENAI_API_KEY" ]; then
            python3 scripts/pipeline/run.py --llm --skip-collect
          else
            echo "no LLM key — leaving collected snapshot only"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.run_id }}
          path: |
            content/pipeline/
            content/issues/
          if-no-files-found: warn
      - name: Open draft PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(TZ=Asia/Seoul date +%F)
          git config user.name "fiv-pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "issue/${DATE}"
          git add content/issues/"${DATE}".json content/pipeline/"${DATE}".draft.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "draft ${DATE} issue from public feeds"
          git push -u origin "issue/${DATE}" --force
          gh pr view "issue/${DATE}" >/dev/null 2>&1 \
            || gh pr create --title "초안: ${DATE} 호" --head "issue/${DATE}" --body "공개 RSS·HN으로 만든 초안입니다. 수치와 출처 URL을 공식 페이지와 맞춘 뒤 머지하면 Vercel이 재빌드합니다." \
            || echo "PR 링크: https://github.com/${{ github.repository }}/pull/new/issue/${DATE}"
